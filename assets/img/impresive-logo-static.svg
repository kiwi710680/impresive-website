<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" id="logo" viewBox="-150 -150 300 300" width="300" height="300" role="img" aria-labelledby="title desc">
  <title id="title">IMPRESIVE network logo</title>
  <desc id="desc">Six blue-to-green nodes connected by ten lines.</desc>
  <defs>
